<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Map Emulator — Control UI</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body>
    <h1>Map Emulator control UI</h1>
    <div style="position: absolute; z-index: 1000; margin: 10px">
      <label>
        Topic:
        <input id="topic" type="text" placeholder="e.g. order-1234" />
      </label>
    </div>
    <div id="map" style="height: 100vh; width: 100vw"></div>

    <script>
      const map = L.map("map").setView([12.957, 77.705], 17); // Bangalore
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      const topicInput = document.getElementById("topic");
      let marker;

      map.on("click", (e) => {
        const topic = topicInput.value.trim();
        if (!topic) {
          alert("Enter a topic before clicking the map.");
          return;
        }

        const { lat, lng } = e.latlng;
        const ts = Date.now();

        if (marker) {
          marker.setLatLng(e.latlng);
        } else {
          marker = L.marker(e.latlng).addTo(map);
        }

        fetch("/location", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic, lat, lng, ts }),
        });
      });
    </script>
  </body>
</html>
