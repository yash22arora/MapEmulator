<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Rider Emulator</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      :root {
        --ink: #16181f;
        --panel: #1f2330;
        --panel-line: #2c3142;
        --muted: #8b90a3;
        --accent: #ff7a33;
        --paper: #f4f5f7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--paper);
        color: var(--ink);
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        flex-shrink: 0;
        gap: 12px;
        padding: 26px 24px;
        background: var(--panel);
        border-bottom: 1px solid var(--panel-line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 4px rgba(255, 122, 51, 0.18);
        flex-shrink: 0;
      }

      .brand-text h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        color: #fff;
        letter-spacing: -0.01em;
      }

      .brand-text p {
        margin: 1px 0 0;
        font-size: 12px;
        color: var(--muted);
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
      }

      .field label {
        display: block;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 4px;
      }

      .field input[type="text"] {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 13px;
        color: #fff;
        background: #2a2f40;
        border: 1px solid var(--panel-line);
        border-radius: 8px;
        padding: 7px 10px;
        width: 160px;
        outline: none;
      }

      .field input[type="text"]::placeholder {
        color: #676c80;
      }

      .field input[type="text"]:focus {
        border-color: var(--accent);
      }

      .toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        color: #d7d9e3;
        cursor: pointer;
        user-select: none;
      }

      .toggle input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }

      .toggle-track {
        position: relative;
        width: 38px;
        height: 22px;
        border-radius: 999px;
        background: #3a3f52;
        flex-shrink: 0;
        transition: background 0.15s ease;
      }

      .toggle-thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.15s ease;
      }

      .toggle input:checked + .toggle-track {
        background: var(--accent);
      }

      .toggle input:checked + .toggle-track .toggle-thumb {
        transform: translateX(16px);
      }

      .toggle input:focus-visible + .toggle-track {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      #queueStatus {
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
        min-width: 70px;
      }

      .primary-button {
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border: none;
        border-radius: 8px;
        padding: 9px 16px;
        cursor: pointer;
      }

      .primary-button:hover {
        filter: brightness(1.08);
      }

      .primary-button:active {
        filter: brightness(0.94);
      }

      #map {
        flex: 1;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <div class="brand-text">
          <h1>Rider Emulator</h1>
          <p>Simulated location producer &mdash; tap the map to move</p>
        </div>
      </div>
      <div class="controls">
        <div class="field">
          <label for="topic">Topic</label>
          <input id="topic" type="text" placeholder="e.g. order-1234" />
        </div>
        <label class="toggle">
          <input id="lowNetworkToggle" type="checkbox" />
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          Low-Network Mode
        </label>
        <span id="queueStatus"></span>
        <button id="markDeliveredButton" class="primary-button" type="button">
          Mark as Delivered
        </button>
      </div>
    </div>
    <div id="map"></div>

    <script>
      const map = L.map("map").setView([28.587, 77.397], 16.5); // Bangalore
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      const topicInput = document.getElementById("topic");
      const lowNetworkToggle = document.getElementById("lowNetworkToggle");
      const queueStatus = document.getElementById("queueStatus");
      const markDeliveredButton = document.getElementById("markDeliveredButton");
      let marker;
      let queuedUpdates = [];

      // TODO (Phase 14): call an endpoint that marks the topic's order
      // delivered and broadcasts the "event: completed" SSE signal.
      markDeliveredButton.addEventListener("click", () => {});

      function updateQueueStatus() {
        queueStatus.textContent = queuedUpdates.length
          ? `(${queuedUpdates.length} queued)`
          : "";
      }

      async function postLocation(payload) {
        const response = await fetch("/location", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!response.ok) {
          throw new Error(`Server responded ${response.status}`);
        }
      }

      // Manual override (checkbox) skips the network entirely, for a
      // reliable demo. A real send failure -- network error, timeout, bad
      // response -- buffers the point too, even with the checkbox off,
      // since that's the actual real-world signal an app can trust.
      async function sendUpdate(payload) {
        if (lowNetworkToggle.checked) {
          queuedUpdates.push(payload);
          updateQueueStatus();
          return;
        }

        try {
          await postLocation(payload);
          // A send just succeeded -- the backend is reachable again, which
          // "online" wouldn't have told us if the server process itself
          // was what came back, not the network interface. Try the backlog.
          flushQueuedUpdates();
        } catch (error) {
          console.warn("Send failed, queueing for retry:", error);
          queuedUpdates.push(payload);
          updateQueueStatus();
        }
      }

      // Flushes the entire backlog as individual POSTs (not conflated here
      // client-side), so the backend's own conflation gets exercised by a
      // real burst. If a send in the middle of the backlog fails again,
      // that item and everything after it goes back in the queue rather
      // than being silently dropped.
      async function flushQueuedUpdates() {
        if (queuedUpdates.length === 0) return;

        const backlog = queuedUpdates;
        queuedUpdates = [];
        updateQueueStatus();

        for (let i = 0; i < backlog.length; i++) {
          try {
            await postLocation(backlog[i]);
          } catch (error) {
            console.warn("Flush failed, re-queueing remainder:", error);
            queuedUpdates = backlog.slice(i).concat(queuedUpdates);
            updateQueueStatus();
            return;
          }
        }
      }

      lowNetworkToggle.addEventListener("change", () => {
        if (!lowNetworkToggle.checked) {
          flushQueuedUpdates();
        }
      });

      // Browser connectivity signal -- unreliable on its own (see chat), so
      // it's only used as a hint to retry, never to gate whether a send is
      // attempted in the first place.
      window.addEventListener("online", () => {
        flushQueuedUpdates();
      });

      map.on("click", (e) => {
        const topic = topicInput.value.trim();
        if (!topic) {
          alert("Enter a topic before clicking the map.");
          return;
        }

        const { lat, lng } = e.latlng;
        const ts = Date.now();

        if (marker) {
          marker.setLatLng(e.latlng);
        } else {
          marker = L.marker(e.latlng).addTo(map);
        }

        sendUpdate({ topic, lat, lng, ts });
      });
    </script>
  </body>
</html>
